server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;  # CHANGE THIS to your domain

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Next.js static assets (cache aggressively)
    location /_next/static {
        alias /home/miradeen/.next/standalone/.next/static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Public assets (favicon, images, etc.)
    location /public {
        alias /home/miradeen/.next/standalone/public;
        expires 30d;
        access_log off;
    }

    # Favicon and icons
    location = /favicon.ico {
        alias /home/miradeen/.next/standalone/public/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Proxy to Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Block sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }
}

